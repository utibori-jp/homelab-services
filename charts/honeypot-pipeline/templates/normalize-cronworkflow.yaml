# Bronze to silver to postgres to Discord, once a day. Three steps in sequence,
# each reading what the one before it wrote, so a failure stops the rest rather
# than handing them a day that is not there. A report about a day that never
# loaded would be worse than no report.
#
# The name stays honeypot-normalize because renaming a CronWorkflow under Argo
# CD means deleting and recreating it, which is not worth the accuracy.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: honeypot-normalize
  namespace: honeypot-analytics
spec:
  # A list since v4; the singular spec.schedule is gone.
  schedules:
    - {{ .Values.normalize.schedule | quote }}
  timezone: {{ .Values.normalize.timezone | quote }}
  # A run that is still going when the next one is due means something is
  # wrong; a second one writing the same partition would not help.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  workflowSpec:
    arguments:
      parameters:
        - name: date
          value: ""
    serviceAccountName: argo-workflow
    entrypoint: daily
    # Longhorn hands the volume over owned by root. 1000:100 is what the
    # image and the Jupyter pod both run as.
    securityContext:
      runAsUser: 1000
      runAsGroup: 100
      fsGroup: 100
    volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Values.dataPvc }}
    templates:
      - name: daily
        steps:
          - - name: normalize
              template: normalize
          - - name: publish
              template: publish
          - - name: report
              template: report

      - name: normalize
        container:
          image: {{ .Values.image }}
          # Empty means yesterday. To redo a day, or to backfill:
          #   argo submit --from cronwf/honeypot-normalize -p date=2026-09-15
          args: ["normalize", "--date", "{{`{{workflow.parameters.date}}`}}"]
          envFrom:
            - secretRef:
                name: {{ .Values.b2.secretName }}
          env:
            - name: HONEYPOT_DATA_DIR
              value: /data
            - name: HONEYPOT_B2_PREFIX
              value: {{ .Values.b2.prefix | quote }}
            - name: HONEYPOT_B2_ENDPOINT
              value: {{ .Values.b2.endpoint | quote }}
            - name: HONEYPOT_B2_REGION
              value: {{ .Values.b2.region | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
        retryStrategy:
          # B2 being briefly unreachable is the failure worth retrying. A bad
          # day's data would fail all three times and stay failed.
          limit: "2"
          retryPolicy: OnError
          backoff:
            duration: "1m"
            factor: "2"

      - name: publish
        container:
          image: {{ .Values.image }}
          args: ["publish", "--date", "{{`{{workflow.parameters.date}}`}}"]
          env:
            - name: HONEYPOT_DATA_DIR
              value: /data
            # Spelled out as libpq variables rather than one connection
            # string, so the only part that has to be sealed is the password.
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: {{ .Values.postgres.passwordKey }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
        retryStrategy:
          # Postgres restarting under it is the failure worth retrying. A day
          # with no silver raises instead, and no retry will conjure one.
          limit: "2"
          retryPolicy: OnError
          backoff:
            duration: "1m"
            factor: "2"

      - name: report
        container:
          image: {{ .Values.image }}
          args: ["report", "--date", "{{`{{workflow.parameters.date}}`}}"]
          envFrom:
            # The B2 keys, which the report only needs to size the bucket. The
            # webhook it posts to comes from its own secret below.
            - secretRef:
                name: {{ .Values.b2.secretName }}
          env:
            - name: HONEYPOT_DATA_DIR
              value: /data
            - name: HONEYPOT_B2_PREFIX
              value: {{ .Values.b2.prefix | quote }}
            - name: HONEYPOT_B2_ENDPOINT
              value: {{ .Values.b2.endpoint | quote }}
            - name: HONEYPOT_B2_REGION
              value: {{ .Values.b2.region | quote }}
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: {{ .Values.postgres.passwordKey }}
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.discord.secretName }}
                  key: {{ .Values.discord.urlKey }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
        retryStrategy:
          # Discord being briefly unavailable is worth another go. A report
          # posted twice is noise; a day with none is a gap nobody notices.
          limit: "2"
          retryPolicy: OnError
          backoff:
            duration: "1m"
            factor: "2"
