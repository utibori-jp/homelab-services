# Built from the analytics directory of the cowrie-honeypot repository.
# Bump the tag here after tagging analytics-vX.Y.Z over there.
image: ghcr.io/utibori-jp/honeypot-analytics:v0.4.0

normalize:
  # The droplet rotates a day's log at its own local midnight and the hourly
  # rclone run ships it within the hour, which lands it well before this. The
  # job asks for yesterday, so a late file would be picked up on the next run
  # rather than lost.
  schedule: "0 2 * * *"
  timezone: UTC

# Writes silver and gold. The same claim Jupyter has mounted, which is why it
# is ReadWriteMany.
dataPvc: honeypot-data

# Where publish writes. The same database the honeypot-postgres chart creates,
# reached across nothing since both live in this namespace.
postgres:
  host: honeypot-postgres.honeypot-analytics.svc.cluster.local
  port: 5432
  user: cowrie
  database: cowrie
  secretName: honeypot-postgres-auth
  passwordKey: POSTGRES_PASSWORD

# Where the daily report is posted. Sealed in manifests/honeypot-analytics with
# the rest, so that Application has to have synced first.
discord:
  secretName: honeypot-discord
  urlKey: DISCORD_WEBHOOK_URL

b2:
  secretName: b2-credentials
  prefix: s3://cowrie-log/cowrie/honeypod1
  endpoint: s3.us-west-004.backblazeb2.com
  region: us-west-004

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 2Gi
