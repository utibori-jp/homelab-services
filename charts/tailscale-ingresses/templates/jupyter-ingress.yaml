apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyter-tailscale
  namespace: {{ .Values.ingresses.jupyter.namespace }}
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - {{ .Values.ingresses.jupyter.hostname }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingresses.jupyter.service.name }}
                port:
                  number: {{ .Values.ingresses.jupyter.service.port }}
