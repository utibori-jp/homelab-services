# Everything that makes the stock jupyter image honeypot aware: the extra
# wheels, the hook that installs them, and a small module that hands back a
# DuckDB connection already pointed at B2.
apiVersion: v1
kind: ConfigMap
metadata:
  name: honeypot-jupyter-env
  namespace: honeypot-analytics
data:
  requirements.txt: |
{{- range .Values.extraPackages }}
    {{ . }}
{{- end }}

  # docker-stacks sources every .sh in before-notebook.d before starting the
  # server. jovyan owns /opt/conda, so this needs no root.
  install-extras.sh: |
    # Sourced, not executed, so no set -e or set -u here. Leaving shell
    # options on leaks them into start.sh, which reads unset variables of
    # its own and dies under set -u.
    echo "installing extra packages"
    if pip install --no-cache-dir --quiet -r /opt/honeypot/requirements.txt; then
      echo "extra packages ready"
    else
      echo "extra package install FAILED, notebook will be missing duckdb/lifelines" >&2
    fi

  honeypot_db.py: |
    """DuckDB connection wired to the Cowrie bronze logs in Backblaze B2.

    Usage from a notebook:

        from honeypot_db import connect
        con = connect()
        con.sql("SELECT eventid, count(*) FROM bronze GROUP BY 1 ORDER BY 2 DESC").show()

    The bronze view reads the gzipped JSON Lines straight out of B2 on every
    query. Cowrie emits a different field set per eventid, so the view unions
    by name and keeps going past records it cannot parse. Narrow it down and
    write the result to silver/ before iterating on it.

    The B2 object each row came from lands in source_file. Cowrie already
    emits a filename field of its own on download events, so the provenance
    column cannot use that name.
    """

    import os

    import duckdb

    DATA_DIR = os.environ.get("HONEYPOT_DATA_DIR", "/home/jovyan/data")
    DB_PATH = os.path.join(DATA_DIR, "duckdb", "honeypot.duckdb")

    SILVER_DIR = os.path.join(DATA_DIR, "silver")
    GOLD_DIR = os.path.join(DATA_DIR, "gold")


    def _sql_literal(value):
        return "'" + str(value).replace("'", "''") + "'"


    def connect(read_only=False):
        for path in (os.path.dirname(DB_PATH), SILVER_DIR, GOLD_DIR):
            os.makedirs(path, exist_ok=True)

        con = duckdb.connect(DB_PATH, read_only=read_only)

        # Keep downloaded extensions on the PVC so a pod restart does not
        # refetch them.
        ext_dir = os.path.join(DATA_DIR, "duckdb", "extensions")
        os.makedirs(ext_dir, exist_ok=True)
        con.execute("SET extension_directory = " + _sql_literal(ext_dir))

        con.install_extension("httpfs")
        con.load_extension("httpfs")

        con.execute(
            "CREATE OR REPLACE SECRET b2 ("
            " TYPE s3,"
            " KEY_ID " + _sql_literal(os.environ["AWS_ACCESS_KEY_ID"]) + ","
            " SECRET " + _sql_literal(os.environ["AWS_SECRET_ACCESS_KEY"]) + ","
            " ENDPOINT " + _sql_literal(os.environ["HONEYPOT_B2_ENDPOINT"]) + ","
            " REGION " + _sql_literal(os.environ["HONEYPOT_B2_REGION"]) + ","
            " URL_STYLE 'path'"
            ")"
        )

        con.execute(
            "CREATE OR REPLACE VIEW bronze AS SELECT * FROM read_json_auto("
            + _sql_literal(os.environ["HONEYPOT_BRONZE_URI"])
            + ", union_by_name = true, ignore_errors = true, filename = 'source_file')"
        )

        return con
