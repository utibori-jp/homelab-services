apiVersion: apps/v1
kind: Deployment
metadata:
  name: honeypot-jupyter
  namespace: honeypot-analytics
spec:
  replicas: {{ .Values.replicas }}
  # The notebooks claim is ReadWriteOnce, so a rolling update would deadlock
  # on the old pod still holding the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: honeypot-jupyter
  template:
    metadata:
      labels:
        app: honeypot-jupyter
    spec:
      # The image's analyst user is uid 1000, group 100. Longhorn hands the
      # volume over owned by root, so fsGroup is what makes it writable.
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
      initContainers:
        # Stores the silver_events view in the workbench database so a SQL
        # client that connects straight to the file can use it. Runs before
        # the server so nothing holds the write lock at the same time.
        - name: init-views
          image: {{ .Values.image }}
          args: ["init-views"]
          env:
            {{- include "honeypot-jupyter.env" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.paths.data }}
      containers:
        - name: jupyter
          image: {{ .Values.image }}
          # The image entrypoint is the analytics CLI, so the server is
          # spelled out here.
          command:
            - jupyter
            - lab
            - --ip=0.0.0.0
            - --port=8888
            - --no-browser
            - --ServerApp.root_dir={{ .Values.paths.notebooks }}
          ports:
            - containerPort: 8888
          envFrom:
            # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, read only against
            # the cowrie/ prefix in B2.
            - secretRef:
                name: {{ .Values.b2.secretName }}
          env:
            # jupyter_server picks this up on its own. Without the secret the
            # server falls back to the random token it prints to the log.
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: JUPYTER_TOKEN
                  optional: true
            {{- include "honeypot-jupyter.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: notebooks
              mountPath: {{ .Values.paths.notebooks }}
            - name: data
              mountPath: {{ .Values.paths.data }}
          startupProbe:
            tcpSocket:
              port: 8888
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: 8888
            periodSeconds: 30
      volumes:
        - name: notebooks
          persistentVolumeClaim:
            claimName: honeypot-notebooks
        - name: data
          persistentVolumeClaim:
            claimName: honeypot-data
