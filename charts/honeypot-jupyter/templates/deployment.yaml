apiVersion: apps/v1
kind: Deployment
metadata:
  name: honeypot-jupyter
  namespace: honeypot-analytics
spec:
  replicas: {{ .Values.replicas }}
  # The notebooks claim is ReadWriteOnce, so a rolling update would deadlock
  # on the old pod still holding the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: honeypot-jupyter
  template:
    metadata:
      labels:
        app: honeypot-jupyter
    spec:
      # jovyan is uid 1000, group users is gid 100. Longhorn hands the volume
      # over owned by root, so fsGroup is what makes it writable.
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
      containers:
        - name: jupyter
          image: {{ .Values.image }}
          ports:
            - containerPort: 8888
          envFrom:
            # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, read only against
            # the cowrie/ prefix in B2.
            - secretRef:
                name: {{ .Values.b2.secretName }}
          env:
            - name: HONEYPOT_DATA_DIR
              value: /home/jovyan/data
            - name: HONEYPOT_B2_ENDPOINT
              value: {{ .Values.b2.endpoint | quote }}
            - name: HONEYPOT_B2_REGION
              value: {{ .Values.b2.region | quote }}
            - name: HONEYPOT_BRONZE_URI
              value: {{ .Values.b2.bronzeUri | quote }}
            - name: PYTHONPATH
              value: /opt/honeypot
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: notebooks
              mountPath: /home/jovyan/work
            - name: data
              mountPath: /home/jovyan/data
            - name: env
              mountPath: /opt/honeypot
            - name: env
              mountPath: /usr/local/bin/before-notebook.d/install-extras.sh
              subPath: install-extras.sh
          # pip install runs before the server binds, so the startup budget is
          # generous. Liveness only cares that the port is still answering.
          startupProbe:
            tcpSocket:
              port: 8888
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 8888
            periodSeconds: 30
      volumes:
        - name: notebooks
          persistentVolumeClaim:
            claimName: honeypot-notebooks
        - name: data
          persistentVolumeClaim:
            claimName: honeypot-data
        - name: env
          configMap:
            name: honeypot-jupyter-env
