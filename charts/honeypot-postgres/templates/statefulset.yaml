apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: honeypot-postgres
  namespace: honeypot-analytics
spec:
  serviceName: honeypot-postgres-headless
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: honeypot-postgres
  template:
    metadata:
      labels:
        app: honeypot-postgres
    spec:
      # The alpine image's postgres user is uid 70. The Debian variants use 999,
      # so this has to move if the tag in values.yaml ever loses its -alpine
      # suffix. Longhorn hands the volume over owned by root, so fsGroup is what
      # makes it writable.
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      # Kubernetes ignores the image's STOPSIGNAL (SIGINT) and sends SIGTERM,
      # which Postgres reads as a smart shutdown: wait for every client session
      # to end, which an idle Grafana connection never does. The preStop hook
      # below stops the server itself, and this leaves it room to finish.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ .Values.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            # Read by initdb on the first boot and never again. Resealing the
            # Secret later does not change the password in the database.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: {{ .Values.postgres.passwordKey }}
            # A subdirectory, not the mount point itself. Longhorn formats the
            # volume ext4, which leaves a lost+found behind, and initdb refuses
            # to start in a directory that is not empty. Letting initdb create
            # its own directory also gets the 0700 permissions it insists on,
            # which fsGroup would otherwise loosen.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # initdb on a first boot, WAL replay after an unclean stop. Two
          # minutes for either, and the liveness probe only starts counting once
          # this one has passed, so a slow recovery does not get killed halfway
          # and turned into the next slow recovery.
          startupProbe:
            exec:
              command:{{ include "honeypot-postgres.pgIsReady" . | nindent 16 }}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command:{{ include "honeypot-postgres.pgIsReady" . | nindent 16 }}
            periodSeconds: 10
          livenessProbe:
            exec:
              command:{{ include "honeypot-postgres.pgIsReady" . | nindent 16 }}
            periodSeconds: 30
          # Fast shutdown: refuse new connections, abort what is in flight,
          # flush to disk. What the image's STOPSIGNAL would have asked for if
          # Kubernetes read it.
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - pg_ctl -D "$PGDATA" -m fast -w stop
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        # Spelled out on purpose. Both local-path and longhorn carry the
        # default annotation on this cluster, so leaving it off picks whichever
        # one the API server decides it likes.
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
