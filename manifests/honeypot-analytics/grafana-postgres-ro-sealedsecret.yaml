# Password for grafana_ro, the read-only role Grafana queries the Cowrie
# session grain as. Read by the initdb.d script in charts/honeypot-postgres on
# the first boot of an empty PGDATA, and never again: resealing this file does
# not change the password in the database, that takes an ALTER ROLE.
#
# Grafana runs in another namespace and a SealedSecret is bound to the one it
# was sealed for, so the same password needs a second copy over there. The
# plaintext is not kept anywhere: read it back out of the live Secret in this
# namespace and reseal that for monitoring.
#
# Sealed against the cluster's current key, strict scope, so the name and
# namespace below are baked into the ciphertext.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-postgres-ro
  namespace: honeypot-analytics
spec:
  encryptedData:
    PGPASSWORD: 
  template:
    metadata:
      name: grafana-postgres-ro
      namespace: honeypot-analytics
