# Discord webhook for the daily report. Write only from the cluster's side,
# so nothing here needs to read it back.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: honeypot-discord
  namespace: honeypot-analytics
spec:
  encryptedData:
    DISCORD_WEBHOOK_URL: 
  template:
    metadata:
      name: honeypot-discord
      namespace: honeypot-analytics
