# Password for the cowrie role in honeypot-postgres. Read by initdb on the
# first boot of the StatefulSet, and by the publish job as PGPASSWORD. The
# other libpq variables (PGHOST, PGPORT, PGUSER, PGDATABASE) are plain values
# in the chart, only this one is secret.
#
# Sealed against the cluster's current key, strict scope, so the name and
# namespace below are baked into the ciphertext and cannot be changed without
# running kubeseal again. The plaintext exists nowhere outside the cluster: if
# it is lost, reseal a new one and ALTER ROLE cowrie.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: honeypot-postgres-auth
  namespace: honeypot-analytics
spec:
  encryptedData:
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: honeypot-postgres-auth
      namespace: honeypot-analytics
