# The Cowrie dashboard, provisioned rather than left in Grafana's own database.
# The sidecar picks this up by the label, from any namespace, so it sits with
# the rest of the honeypot's manifests instead of next to Grafana.
#
# Built in the UI and exported. Editing it there still works, but the change
# lives only in Grafana until it is exported over this file again.
apiVersion: v1
kind: ConfigMap
metadata:
  name: honeypot-dashboard
  namespace: honeypot-analytics
  labels:
    grafana_dashboard: "1"
data:
  honeypot-overview.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "SSH traffic against the Cowrie honeypot, at session grain.\n\nNot live. A batch runs at 02:00 UTC and loads the previous day, so the most\nrecent data is yesterday and today does not appear until tomorrow morning.\n\nRows come from the honeypot's own logs, shipped to B2 and normalized on the way.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "honeypot-postgres"
          },
          "description": "SSH sessions counted by the hour they connected. A session that outlives the\nhour boundary still belongs to the hour it started in, so this reads as arrival\nrate rather than concurrency.\n\nCounts sessions, not events: one connection is one row no matter how many\nlogin attempts or commands it carried. Timestamps are stored in UTC.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 0,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "auto",
                "showValues": false,
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "single",
              "sort": "none"
            }
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "dataset": "cowrie",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "honeypot-postgres"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT date_trunc('hour', connect_time) AS time, count(*) AS sessions\r\nFROM sessions\r\nWHERE $__timeFilter(connect_time)\r\nGROUP BY 1 ORDER BY 1",
              "refId": "A",
              "sql": {
                "columns": [
                  {
                    "parameters": [],
                    "type": "function"
                  }
                ],
                "groupBy": [
                  {
                    "property": {
                      "type": "string"
                    },
                    "type": "groupBy"
                  }
                ],
                "limit": 50
              }
            }
          ],
          "title": "Sessions per hour",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "honeypot-postgres"
          },
          "description": "Sessions grouped by the /24 the source address falls in. Rolled up rather than\nlisted per address because a single campaign spreads itself across neighbouring\naddresses in the same block, and the block is what behaves as one actor.\n\nRanked over the selected time range, so the order moves with the time picker.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "options": {
            "cellHeight": "sm",
            "showHeader": true
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "dataset": "cowrie",
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT set_masklen(src_ip::cidr, 24)::text AS network, count(*) AS sessions\r\nFROM sessions\r\nWHERE $__timeFilter(connect_time)\r\nGROUP BY 1 ORDER BY 2 DESC LIMIT 20",
              "refId": "A",
              "sql": {
                "columns": [
                  {
                    "parameters": [],
                    "type": "function"
                  }
                ],
                "groupBy": [
                  {
                    "property": {
                      "type": "string"
                    },
                    "type": "groupBy"
                  }
                ],
                "limit": 50
              }
            }
          ],
          "title": "Top source networks",
          "type": "table"
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "honeypot-postgres"
          },
          "description": "Session lifetime from connect to close, in buckets chosen to keep the two things\nthat matter visible.\n\nMost sessions end within seconds. The bucket at roughly 120 seconds is not\nattacker behaviour: it is Cowrie's own authentication timeout cutting off\nsessions that never logged in, which is why it stands apart from the decay on\neither side.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "fillOpacity": 80,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineWidth": 1,
                "scaleDistribution": {
                  "type": "linear"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 7,
          "options": {
            "barRadius": 0,
            "barWidth": 0.97,
            "fullHighlight": false,
            "groupWidth": 0.7,
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "orientation": "auto",
            "showValue": "auto",
            "stacking": "none",
            "tooltip": {
              "hideZeros": false,
              "mode": "single",
              "sort": "none"
            },
            "xTickLabelRotation": 0,
            "xTickLabelSpacing": 0
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "dataset": "cowrie",
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT CASE\r\n    WHEN duration_ms <   1000 THEN '< 1s'\r\n    WHEN duration_ms <   5000 THEN '1-5s'\r\n    WHEN duration_ms <  30000 THEN '5-30s'\r\n    WHEN duration_ms < 119000 THEN '30-119s'\r\n    WHEN duration_ms < 121000 THEN '~120s (auth timeout)'\r\n    ELSE '> 121s' END AS bucket,\r\n  count(*) AS sessions\r\nFROM sessions\r\nWHERE $__timeFilter(connect_time) AND duration_ms IS NOT NULL\r\nGROUP BY 1 ORDER BY min(duration_ms)",
              "refId": "A",
              "sql": {
                "columns": [
                  {
                    "parameters": [],
                    "type": "function"
                  }
                ],
                "groupBy": [
                  {
                    "property": {
                      "type": "string"
                    },
                    "type": "groupBy"
                  }
                ],
                "limit": 50
              }
            }
          ],
          "title": "Session duration",
          "type": "barchart"
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "honeypot-postgres"
          },
          "description": "Command lines as Cowrie received them, counted per execution rather than per\nsession.\n\nEntries can be long. A single line sometimes carries an entire dropper, with\nfingerprinting, download and cleanup separated by semicolons.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "id": 5,
          "options": {
            "cellHeight": "sm",
            "showHeader": true
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "dataset": "cowrie",
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT input AS command, count(*) AS runs\r\nFROM commands\r\nWHERE $__timeFilter(ts)\r\nGROUP BY 1 ORDER BY 2 DESC LIMIT 20",
              "refId": "A",
              "sql": {
                "columns": [
                  {
                    "parameters": [],
                    "type": "function"
                  }
                ],
                "groupBy": [
                  {
                    "property": {
                      "type": "string"
                    },
                    "type": "groupBy"
                  }
                ],
                "limit": 50
              }
            }
          ],
          "title": "Most run commands",
          "type": "table"
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "honeypot-postgres"
          },
          "description": "The share of sessions that reached a successful login, by day. Cowrie accepts\ncredentials by design, so this says how many sessions got far enough to\nauthenticate at all, not anything about how well guarded the host is.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 0,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "auto",
                "showValues": false,
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "id": 6,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "min",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "single",
              "sort": "none"
            }
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "dataset": "cowrie",
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT date_trunc('day', connect_time) AS time,\r\n       100.0 * count(*) FILTER (WHERE login_success) / nullif(count(*), 0) AS \"login success %\"\r\nFROM sessions\r\nWHERE $__timeFilter(connect_time)\r\nGROUP BY 1 ORDER BY 1",
              "refId": "A",
              "sql": {
                "columns": [
                  {
                    "parameters": [],
                    "type": "function"
                  }
                ],
                "groupBy": [
                  {
                    "property": {
                      "type": "string"
                    },
                    "type": "groupBy"
                  }
                ],
                "limit": 50
              }
            }
          ],
          "title": "Login success rate",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "honeypot-postgres"
          },
          "description": "Username and password pairs as they arrived, counted per attempt rather than per\nsession, so one session that tried several times contributes several rows.\n\nFailures and successes are counted together. A dash means Cowrie recorded the\nattempt without that field.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 17
          },
          "id": 3,
          "options": {
            "cellHeight": "sm",
            "showHeader": true
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "dataset": "cowrie",
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT coalesce(username, '-') AS username,\r\n       coalesce(password, '-') AS password,\r\n       count(*) AS attempts\r\nFROM login_attempts\r\nWHERE $__timeFilter(ts)\r\nGROUP BY 1, 2 ORDER BY 3 DESC LIMIT 20",
              "refId": "A",
              "sql": {
                "columns": [
                  {
                    "parameters": [],
                    "type": "function"
                  }
                ],
                "groupBy": [
                  {
                    "property": {
                      "type": "string"
                    },
                    "type": "groupBy"
                  }
                ],
                "limit": 50
              }
            }
          ],
          "title": "Most tried credentials",
          "type": "table"
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "honeypot-postgres"
          },
          "description": "The client's hassh fingerprint next to the version string it announced. hassh is\na hash of the algorithms offered during the handshake, so it identifies the\nimplementation even when the version string is generic or forged.\n\nThe version on its own is worth little here: most of this traffic announces the\nsame handful of strings.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 21
          },
          "id": 4,
          "options": {
            "cellHeight": "sm",
            "showHeader": true
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "dataset": "cowrie",
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT coalesce(hassh, '-') AS hassh,\r\n       coalesce(client_version, '-') AS client,\r\n       count(*) AS sessions\r\nFROM sessions\r\nWHERE $__timeFilter(connect_time)\r\nGROUP BY 1, 2 ORDER BY 3 DESC LIMIT 20",
              "refId": "A",
              "sql": {
                "columns": [
                  {
                    "parameters": [],
                    "type": "function"
                  }
                ],
                "groupBy": [
                  {
                    "property": {
                      "type": "string"
                    },
                    "type": "groupBy"
                  }
                ],
                "limit": 50
              }
            }
          ],
          "title": "SSH clients",
          "type": "table"
        }
      ],
      "preload": false,
      "schemaVersion": 42,
      "tags": [],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-8d",
        "to": "now-1d"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Cowrie honeypot",
      "uid": "honeypot-overview",
      "weekStart": ""
    }
