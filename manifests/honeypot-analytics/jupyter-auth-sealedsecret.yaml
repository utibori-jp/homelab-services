# Fixed login token for the Jupyter server. Low entropy on purpose: the only
# way to reach the server is the tailnet, and a random token that changes on
# every restart was not worth the friction. The deployment treats this secret
# as optional and falls back to a random token when it is missing.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: honeypot-jupyter-auth
  namespace: honeypot-analytics
spec:
  encryptedData:
    JUPYTER_TOKEN: 
  template:
    metadata:
      name: honeypot-jupyter-auth
      namespace: honeypot-analytics
