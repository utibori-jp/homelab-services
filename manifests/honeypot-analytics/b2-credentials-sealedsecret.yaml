# Backblaze B2 application key, used with the S3 compatible endpoint.
# Sealed against the cluster's current key, strict scope, so the name and
# namespace below are baked into the ciphertext and cannot be changed
# without running kubeseal again.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: b2-credentials
  namespace: honeypot-analytics
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_SECRET_ACCESS_KEY: 
  template:
    metadata:
      name: b2-credentials
      namespace: honeypot-analytics
