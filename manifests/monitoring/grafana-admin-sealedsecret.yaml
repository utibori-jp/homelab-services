# Grafana's own admin login. Read once, when Grafana initializes its sqlite
# database on a first boot: changing this file afterwards does not change the
# password, that is done in the UI or by deleting the PVC.
#
# The user is in here alongside the password because the chart reads both from
# one Secret (admin.userKey and admin.passwordKey).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin
      namespace: monitoring
