# The same grafana_ro password that honeypot-analytics holds. A SealedSecret is
# bound to the namespace it was sealed for, so the one database password needs
# a copy on each side: the initdb.d script reads it over there to create the
# role, Grafana reads it here to connect as it.
#
# Resealed from the live Secret in honeypot-analytics rather than from a stored
# plaintext, which is why the two match. If they ever drift, that is the way to
# bring them back together.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-postgres-ro
  namespace: monitoring
spec:
  encryptedData:
    PGPASSWORD: 
  template:
    metadata:
      name: grafana-postgres-ro
      namespace: monitoring
