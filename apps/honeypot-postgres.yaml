# Where the Cowrie session data lands so Grafana can query it with SQL. The
# namespace and the password come from the honeypot-analytics Application, so
# CreateNamespace is off.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: honeypot-postgres
  namespace: argocd
  annotations:
    # The API server fills in apiVersion, kind, volumeMode and status inside
    # spec.volumeClaimTemplates, and the default 3-way diff reads those as a
    # difference no sync can resolve, so the Application sits OutOfSync forever
    # while selfHeal keeps reapplying it. ServerSideDiff compares against a
    # server-side apply dry run instead, the same comparison kubectl diff makes.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/utibori-jp/homelab-services.git
    path: charts/honeypot-postgres
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: honeypot-analytics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
