# Sealed Secrets controller. Installed by hand with Helm first, then adopted
# by Argo CD. The chart version and values below have to keep matching the
# live release, otherwise the sync renames resources instead of adopting them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: "2.20.0"
    helm:
      values: |
        # kubeseal looks for a service called sealed-secrets-controller in
        # kube-system unless you pass --controller-name. Keep this name.
        fullnameOverride: sealed-secrets-controller
        # 0 turns off automatic sealing key rotation. The key is generated
        # once on first start and is not part of this chart, so neither
        # helm uninstall nor an Argo prune removes it.
        keyrenewperiod: "0"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
