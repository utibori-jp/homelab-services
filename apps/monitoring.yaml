# Owns the monitoring namespace and the credentials shared by everything in
# it. Grafana itself is a separate Application pointing at the same namespace,
# the way honeypot-analytics and its workloads are split.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/utibori-jp/homelab-services.git
    path: manifests/monitoring
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The Namespace is declared in manifests/, so Argo CD does not need to
      # conjure one. Left on as a safety net for a first sync where the
      # Namespace has not been applied yet.
      - CreateNamespace=true
      - ServerSideApply=true
